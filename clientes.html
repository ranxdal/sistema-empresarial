<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Empresarial - Clientes</title>
</head>
<body>
    <header>
        <h1>Módulo de Clientes</h1>
        <nav>
            <a href="index.html">Inicio</a> |
            <a href="productos.html">Productos</a> |
            <a href="clientes.html">Clientes</a>
        </nav>
    </header>

    <main>
        <h2>Listado de clientes</h2>
        <table border="1" cellpadding="6">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>C001</td>
                    <td>Cliente de ejemplo</td>
                    <td>5555-5555</td>
                    <td>cliente@correo.com</td>
                </tr>
            </tbody>
        </table>
                <h2>Registrar nuevo cliente</h2>
        <form>
            <p><label>Nombre: <input type="text" name="nombre" required></label></p>
            <p><label>Teléfono: <input type="tel" name="telefono"></label></p>
            <p><label>Correo: <input type="email" name="correo"></label></p>
            <button type="submit">Guardar cliente</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Sistema Empresarial</p>
    </footer>
</body>
</html>
