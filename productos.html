<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Empresarial - Productos</title>
</head>
<body>
    <header>
        <h1>Módulo de Productos</h1>
        <nav>
            <a href="index.html">Inicio</a> |
            <a href="productos.html">Productos</a> |
            <a href="clientes.html">Clientes</a>
        </nav>
    </header>

    <main>
        <h2>Listado de productos</h2>
        <table border="1" cellpadding="6">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Existencia</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>P001</td>
                    <td>Producto de ejemplo</td>
                    <td>Q50.00</td>
                    <td>100</td>
                </tr>
            </tbody>
        </table>
                <h2>Registrar nuevo producto</h2>
        <form>
            <p><label>Nombre: <input type="text" name="nombre" required></label></p>
            <p><label>Precio: <input type="number" name="precio" step="0.01" min="0"></label></p>
            <p><label>Existencia: <input type="number" name="existencia" min="0"></label></p>
            <button type="submit">Guardar producto</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Sistema Empresarial</p>
    </footer>
</body>
</html>
